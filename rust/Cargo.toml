[package]
name = "swiftylark-core"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "swiftylark-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
